services:
    db:
        image: postgres:15-alpine
        container_name: kaiju_db
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports: 
            - "5432:5432"
        volumes: 
            - postgres_data:/var/lib/postgresql/data
        networks:
            kaiju-net:
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5    

    backend:
        build: 
            context: ./backend
            dockerfile: Dockerfile 
        container_name: kaiju_backend
        environment:
            - PORT=3000
            - DB_HOST=db
            - DB_PORT=5432
            - DB_USER=${POSTGRES_USER}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_NAME=${POSTGRES_DB}
            - DEMO_PASSWORD=${DEMO_PASSWORD}
            - SECRET_KEY=${SECRET_KEY}
            - TRAVEL_SECONDS=${TRAVEL_SECONDS:-30}
            - BLOCK_SECONDS=${BLOCK_SECONDS:-120}
            - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
            - DISASTER_EVERY_SECONDS=${DISASTER_EVERY_SECONDS:-0}
        ports:
            - "3000:3000"
        depends_on:
            db:
                condition: service_healthy
        networks:
            kaiju-net:
        restart: unless-stopped

    frontend:
        build: 
            context: ./frontend
            dockerfile: Dockerfile
        container_name: kaiju_frontend
        ports:
            - "8080:80"
        networks:
            kaiju-net:
        restart: unless-stopped

volumes:
    postgres_data:

networks:
    kaiju-net:
        driver: bridge